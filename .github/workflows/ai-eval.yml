# AI eval (ADR-019): generates a widget for every image in docs/ai-eval with the real prompt,
# schema, parser and renderer, and uploads side-by-side images (original | render).
# Manual only. Uses the repository secret GEMINI_API_KEY, which is passed to the test process
# as an environment variable and never printed (GitHub also masks it in logs).
name: AI eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model ID (empty = the app's default)"
        type: string
        default: ""
      review:
        description: "High quality: add the self-review round"
        type: boolean
        default: false
      structured:
        description: "Start with the provider's structured output (off = prompt-only JSON mode)"
        type: boolean
        default: true
      cases:
        description: "Comma-separated image file names (empty = all)"
        type: string
        default: ""

concurrency:
  group: ai-eval
  cancel-in-progress: true

jobs:
  eval:
    name: Generate and render
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check the secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add the repository secret GEMINI_API_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: ios/WidgetKitCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('ios/WidgetKitCore/Package.swift') }}

      - name: Run the eval
        env:
          AI_EVAL: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_EVAL_DIR: ${{ github.workspace }}/docs/ai-eval
          AI_EVAL_OUT: ${{ github.workspace }}/ai-eval-out
          AI_EVAL_FONTS: ${{ github.workspace }}/ios/Fonts
          AI_EVAL_MODEL: ${{ inputs.model }}
          AI_EVAL_REVIEW: ${{ inputs.review && '1' || '0' }}
          AI_EVAL_CASES: ${{ inputs.cases }}
          AI_EVAL_STRUCTURED: ${{ inputs.structured && '1' || '0' }}
        run: swift test --package-path ios/WidgetKitCore --filter AIEvalTests

      - name: Summary
        if: always()
        run: |
          [ -f ai-eval-out/summary.md ] && cat ai-eval-out/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-eval
          path: ai-eval-out
          if-no-files-found: warn
          retention-days: 14
