# Android (M7, ADR-025): unit tests, template renders compared with iOS, and a debug build on every
# push that touches the Android app or the shared spec files; the signed release APK and .aab only
# with [apk] in the head commit message or a manual run. Ubuntu only, no macOS.
name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ios/Fonts/**"
      - "ios/WidgetKitCore/Sources/WidgetKitCore/Resources/**"
      - "ios/WidgetKitCore/Sources/WidgetKitCore/Prompts/**"
      - "ios/WidgetKitCore/Sources/WidgetKitCore/Spec/Icons.swift"
      - "ios/WidgetKitCore/Sources/WidgetKitCore/Spec/TemplateLibrary.swift"
      - "ios/WidgetStudioTests/Snapshots/**"
      - "ios/WidgetKitCore/Tests/WidgetKitCoreTests/Fixtures/**"
      - "docs/ai-eval/recorded/**"
      - "docs/ai-eval/wiring-best.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          # The first run cached broken downloads from a Maven Central hiccup; builds stay uncached.
          cache-disabled: true

      - name: Unit tests and debug APK
        env:
          RENDER_OUT: ${{ github.workspace }}/android-renders
        run: gradle -p android testDebugUnitTest assembleDebug --stacktrace --refresh-dependencies

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-renders
          path: android-renders
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Signed release APK and AAB
    needs: build
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          # The first run cached broken downloads from a Maven Central hiccup; builds stay uncached.
          cache-disabled: true

      # The release keystore lives only in repository secrets (base64) and the owner's backup.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 secret (see docs/decisions.md, ADR-025)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease bundleRelease --stacktrace

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: WidgetStudio-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
